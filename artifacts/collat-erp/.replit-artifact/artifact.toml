kind = "web"
previewPath = "/"
title = "Collage ERP"
description = "Collage ERP is an operations and finance workspace for a corporate marketing, event branding, advertising and rental business. It brings client management, project delivery, quotes and GHS invoicing into one cohesive system."
version = "1.0.0"
id = "artifacts/collat-erp"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18902

[services.development]
run = "pnpm --filter @workspace/collat-erp run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/collat-erp", "run", "build" ]
serve = "static"
publicDir = "artifacts/collat-erp/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18902"
BASE_PATH = "/"
